<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pengaturan Printer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      background: #f3f4f6;
      color: #111;
      padding: 20px;
      user-select: none;
    }

    h1 {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 16px;
      color: #111;
    }

    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #6b7280;
      margin-bottom: 12px;
    }

    .field { margin-bottom: 12px; }
    .field:last-child { margin-bottom: 0; }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 4px;
      font-size: 12px;
    }

    select, input[type="text"] {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 13px;
      background: #fff;
      color: #111;
      outline: none;
      transition: border-color 0.15s;
    }

    select:focus, input[type="text"]:focus {
      border-color: #6366f1;
    }

    .checkbox-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      cursor: pointer;
    }

    .checkbox-row input[type="checkbox"] {
      margin-top: 1px;
      width: 15px;
      height: 15px;
      flex-shrink: 0;
      cursor: pointer;
    }

    .checkbox-label { line-height: 1.4; }
    .checkbox-hint { font-size: 11px; color: #6b7280; margin-top: 2px; }

    .actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 4px;
    }

    .btn {
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-primary { background: #111; color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #374151; }

    .btn-secondary { background: #e5e7eb; color: #111; }
    .btn-secondary:hover:not(:disabled) { background: #d1d5db; }

    .btn-test { background: #4f46e5; color: #fff; }
    .btn-test:hover:not(:disabled) { background: #4338ca; }

    .notice {
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 12px;
      margin-top: 10px;
      display: none;
    }

    .notice.ok { background: #ecfdf5; border: 1px solid #86efac; color: #065f46; display: block; }
    .notice.err { background: #fef2f2; border: 1px solid #fca5a5; color: #991b1b; display: block; }
    .notice.info { background: #eff6ff; border: 1px solid #93c5fd; color: #1e40af; display: block; }

    .hint-box {
      background: #fffbeb;
      border: 1px solid #fcd34d;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 11px;
      color: #92400e;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h1>Pengaturan Printer</h1>

  <div class="card">
    <div class="card-title">Printer</div>

    <div class="field">
      <label for="sel-printer">Pilih Printer</label>
      <select id="sel-printer">
        <option value="">— Default Printer Windows —</option>
      </select>
    </div>

    <div class="field">
      <label class="checkbox-row" for="chk-raw-cut">
        <input type="checkbox" id="chk-raw-cut">
        <span class="checkbox-label">
          Kirim perintah ESC/POS cut setelah print
          <div class="checkbox-hint">
            Mengirim sinyal cut langsung ke printer via port Windows.
            Aktifkan jika printer tidak auto-cut dari driver.
          </div>
        </span>
      </label>
    </div>

    <div class="field">
      <label class="checkbox-row" for="chk-auto-return">
        <input type="checkbox" id="chk-auto-return">
        <span class="checkbox-label">
          Kembali ke POS otomatis setelah print
        </span>
      </label>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Panduan</div>
    <div class="hint-box">
      <strong>Auto-cut via driver:</strong> Buka Properties printer di Windows →
      tab Advanced / Device Settings → aktifkan "Auto Cutter" atau "Paper Cut".<br><br>
      <strong>Shortcut:</strong> Ctrl+Shift+P membuka halaman ini dari layar POS.
    </div>
  </div>

  <div id="notice" class="notice"></div>

  <div class="actions">
    <button class="btn btn-test" id="btn-test" type="button">Test Print</button>
    <button class="btn btn-secondary" id="btn-cancel" type="button">Tutup</button>
    <button class="btn btn-primary" id="btn-save" type="button">Simpan</button>
  </div>

  <script>
    const selPrinter   = document.getElementById('sel-printer');
    const chkRawCut    = document.getElementById('chk-raw-cut');
    const chkAutoReturn = document.getElementById('chk-auto-return');
    const noticeEl     = document.getElementById('notice');
    const btnSave      = document.getElementById('btn-save');
    const btnTest      = document.getElementById('btn-test');
    const btnCancel    = document.getElementById('btn-cancel');

    function showNotice(msg, type) {
      noticeEl.textContent = msg;
      noticeEl.className = 'notice ' + type;
    }

    function hideNotice() {
      noticeEl.className = 'notice';
    }

    async function init() {
      const [printers, settings] = await Promise.all([
        window.SettingsAPI.getPrinters(),
        window.SettingsAPI.getSettings(),
      ]);

      // Populate printer list
      printers.forEach((p) => {
        const opt = document.createElement('option');
        opt.value = p.name;
        opt.textContent = p.name + (p.isDefault ? ' (Default)' : '');
        selPrinter.appendChild(opt);
      });

      // Apply saved settings
      selPrinter.value = settings.printerName || '';
      chkRawCut.checked = !!settings.sendRawCut;
      chkAutoReturn.checked = settings.autoReturn !== false;
    }

    btnSave.addEventListener('click', async () => {
      btnSave.disabled = true;
      hideNotice();
      try {
        await window.SettingsAPI.saveSettings({
          printerName: selPrinter.value,
          sendRawCut: chkRawCut.checked,
          autoReturn: chkAutoReturn.checked,
        });
        showNotice('Pengaturan berhasil disimpan.', 'ok');
      } catch (err) {
        showNotice('Gagal menyimpan: ' + err.message, 'err');
      } finally {
        btnSave.disabled = false;
      }
    });

    btnTest.addEventListener('click', async () => {
      btnTest.disabled = true;
      hideNotice();
      showNotice('Mengirim test print...', 'info');
      try {
        const result = await window.SettingsAPI.testPrint(selPrinter.value);
        showNotice(result.message, result.ok ? 'ok' : 'err');
      } catch (err) {
        showNotice('Error: ' + err.message, 'err');
      } finally {
        btnTest.disabled = false;
      }
    });

    btnCancel.addEventListener('click', () => window.close());

    init().catch((err) => showNotice('Gagal memuat: ' + err.message, 'err'));
  </script>
</body>
</html>
